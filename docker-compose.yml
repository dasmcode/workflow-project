services:
  app:
    depends_on:
      - postgres
      - redis
    networks:
      - app-network
    build: .
    ports:
      - 8000:8000
    environment:
       server : postgres
       REDIS_SERVER : redis
  worker:
    depends_on:
      - postgres
      - redis
    networks:
      - app-network
    build: .
    command: python -m app.workers.worker
    environment:
       server : postgres
       REDIS_SERVER : redis
  postgres:
    networks:
      - app-network
    image: postgres
    environment:
       POSTGRES_DB : ${database}
       POSTGRES_USER : ${username}
       POSTGRES_PASSWORD : ${password}
    ports:
      - 5432:5432
    volumes:
      - pg_data:/var/lib/postgresql
  redis:
    networks:
      - app-network
    image: redis
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
volumes:
  pg_data:
  redis-data:
networks:
  app-network:
