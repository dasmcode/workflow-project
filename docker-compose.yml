services:
  web:
    depends_on:
      - backend
    networks:
      - app-network
    build:
      context: ./web
    image: workflow-web:latest
    ports:
      - 3000:80
  backend:
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - app-network
    build:
      context: ./backend
    image: workflow-backend:latest
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /appuser
    ports:
      - 8000:8000
    volumes:
      - uploads_files:/appuser/uploads:rw
      - ./backend/model_cache/docling:/appuser/.cache/docling:ro
  worker:
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    networks:
      - app-network
    image: workflow-backend:latest
    command: uv run python -m app.workers.worker
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /appuser
    volumes:
      - uploads_files:/appuser/uploads
      - ./backend/model_cache/docling:/appuser/.cache/docling:ro
  postgres:
    env_file:
      - ./backend/.env
    networks:
      - app-network
    image: postgres:latest
    ports:
      - 5432:5432
    volumes:
      - pg_data:/var/lib/postgresql
  redis:
    networks:
      - app-network
    image: redis:latest
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
  qdrant:
    networks:
      - app-network
    image: qdrant/qdrant:latest
    ports:
      - 6333:6333
    volumes:
      - qdrant_data:/qdrant/storage
volumes:
  pg_data:
  redis-data:
  qdrant_data:
  uploads_files:
networks:
  app-network:
