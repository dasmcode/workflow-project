services:
  web:
    depends_on:
      - backend
    networks:
      - app-network
    build:
      context: ./web
    image: workflow-web:latest
    ports:
      - 3000:80
  backend:
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - app-network
    build:
      context: ./backend
    image: workflow-backend:latest
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /appuser
    ports:
      - 8000:8000
    volumes:
      - uploads_files:/appuser/uploads:rw
      - prometheus_data:/tmp/prometheus
  worker:
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    networks:
      - app-network
    image: workflow-backend:latest
    command: uv run python -m app.workers.worker
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /appuser
    volumes:
      - uploads_files:/appuser/uploads
      - prometheus_data:/tmp/prometheus
      - ./backend/model_cache/docling:/appuser/.cache/docling:ro

  worker-metrics:
    networks:
      - app-network
    depends_on:
      - worker
    build:
      context: ./backend
    command: uv run uvicorn app.workers.worker_metrics_server:app --host 0.0.0.0 --port 8001
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    volumes:
      - prometheus_data:/tmp/prometheus
    ports:
      - 8001:8001
  postgres:
    env_file:
      - ./backend/.env
    networks:
      - app-network
    build:
      context: ./postgres
    ports:
      - 5432:5432
    command: ["postgres", "-c", "shared_preload_libraries=pg_textsearch"]
    volumes:
      - ./postgres/init-extension.sql:/docker-entrypoint-initdb.d/init-extension.sql
      - pg_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_gui
    networks:
      - app-network
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    networks:
      - app-network
    image: redis:latest
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
  qdrant:
    networks:
      - app-network
    image: qdrant/qdrant:latest
    ports:
      - 6333:6333
    volumes:
      - qdrant_data:/qdrant/storage
  prometheus:
    networks:
      - app-network
    image: prom/prometheus
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - 3030:3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - app-network
volumes:
  pg_data:
  redis-data:
  qdrant_data:
  uploads_files:
  pgadmin_data:
  prometheus_data:
  grafana_data:
    external: true
networks:
  app-network:
